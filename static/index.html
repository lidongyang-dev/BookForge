<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%236750a4%22/%3E%3Cpath d=%22M6 6.5c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1v-11z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M9 9.5h6M9 12.5h6M9 15.5h4%22 stroke=%22%236750a4%22 stroke-width=%221.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<title>BookForge · 自制 Kindle 书籍工作台</title>
<style>
  :root {
    /* Material 3 动态色板（由种子色派生，JS 切换主题时覆盖这些源变量） */
    --md-primary: #6750a4;
    --md-on-primary: #ffffff;
    --md-primary-container: #eaddff;
    --md-on-primary-container: #21005d;
    --md-secondary-container: #e8def8;
    --md-on-secondary-container: #1d192b;
    --md-surface: #fdf8ff;
    --md-surface-dim: #ded8e1;
    --md-surface-container-lowest: #ffffff;
    --md-surface-container-low: #f7f2fa;
    --md-surface-container: #f3edf7;
    --md-surface-container-high: #ece6f0;
    --md-surface-container-highest: #e6e0e9;
    --md-on-surface: #1d1b20;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-outline-variant: #cac4d0;
    --md-error: #b3261e;
    --md-error-container: #f9dedc;
    --md-on-error-container: #410e0b;
    --md-success: #386a20;
    --md-success-container: #d7f2c0;
    --md-on-success-container: #112100;
    /* 兼容旧变量名（新样式直接用 --md-*，旧引用经此映射） */
    --accent: var(--md-primary);
    --accent-dark: var(--md-on-primary-container);
    --accent-soft: var(--md-primary-container);
    --paper: var(--md-surface);
    --ink: var(--md-on-surface);
    --ink-soft: var(--md-on-surface-variant);
    --card: var(--md-surface-container-lowest);
    --line: var(--md-outline-variant);
    --ok: var(--md-success);
    --err: var(--md-error);
    --shadow-1: 0 1px 2px rgba(0,0,0,.18), 0 1px 3px 1px rgba(0,0,0,.12);
    --shadow-2: 0 2px 4px rgba(0,0,0,.18), 0 2px 6px 2px rgba(0,0,0,.12);
    --radius-l: 24px;
    --radius-m: 16px;
    --radius-s: 12px;
    --radius-pill: 999px;
    --transition: .18s cubic-bezier(.2,0,0,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--md-surface);
    color: var(--md-on-surface);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }

  /* 主题色选择条 */
  .theme-bar {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    margin: -8px 0 22px;
  }
  .theme-label { font-size: 12px; color: var(--md-on-surface-variant); letter-spacing: .5px; }
  .theme-swatches { display: flex; gap: 8px; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    transition: transform var(--transition), border-color var(--transition);
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.on { border-color: var(--md-on-surface); }
  .theme-custom { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; position: relative;
    border: 2px solid var(--md-outline-variant); cursor: pointer; background:
    conic-gradient(red,yellow,lime,cyan,blue,magenta,red); flex-shrink: 0;
    display: inline-block;
  }
  .theme-custom input { position: absolute; inset: -6px; width: 34px; height: 34px; opacity: 0; cursor: pointer; }

  /* 页头 */
  header { text-align: center; margin-bottom: 30px; }
  .logo { font-size: 40px; font-weight: 700; letter-spacing: .5px; color: var(--md-on-surface); }
  .logo span { color: var(--md-primary); }
  .tagline { color: var(--md-on-surface-variant); margin-top: 8px; font-size: 14px; }

  /* Tab：M3 分段按钮 */
  .tabs {
    display: flex; gap: 4px; padding: 4px; background: var(--md-surface-container-high);
    border-radius: var(--radius-pill); margin-bottom: 20px;
  }
  .tab {
    flex: 1; padding: 11px 0; text-align: center; cursor: pointer;
    border: none; border-radius: var(--radius-pill);
    background: transparent; color: var(--md-on-surface-variant);
    font-size: 14px; font-weight: 600; font-family: inherit;
    transition: background var(--transition), color var(--transition);
  }
  .tab.active { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .tab:hover:not(.active) { color: var(--md-on-surface); }

  /* 卡片：surface 层次 + 大圆角 + M3 阴影 */
  .card {
    background: var(--md-surface-container-lowest);
    border: 1px solid var(--md-outline-variant);
    border-radius: var(--radius-l);
    padding: 26px; box-shadow: var(--shadow-1);
  }
  .pane { display: none; }
  .pane.active { display: block; }

  /* 表单 */
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--md-on-surface); }
  .field label small { font-weight: 400; color: var(--md-on-surface-variant); }
  input[type=text], select, textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--md-outline);
    border-radius: var(--radius-s); font-size: 14px; background: transparent;
    color: var(--md-on-surface); font-family: inherit; outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  input::placeholder, textarea::placeholder { color: var(--md-on-surface-variant); opacity: .7; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--md-primary); box-shadow: 0 0 0 2px var(--md-primary-container);
  }
  .row { display: flex; gap: 14px; }
  .row .field { flex: 1; }

  /* 章节编辑器 */
  .chapter {
    border: 1px solid var(--md-outline-variant); border-radius: var(--radius-m);
    padding: 14px; margin-bottom: 12px; background: var(--md-surface-container-low);
  }
  .chapter-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .chapter-head .no { font-weight: 700; color: var(--md-primary); font-size: 14px; min-width: 42px; }
  .chapter-head input { flex: 1; }
  .btn-del {
    border: none; background: transparent; color: var(--md-error); cursor: pointer;
    font-size: 13px; padding: 6px 10px; border-radius: var(--radius-s);
    transition: background var(--transition);
  }
  .btn-del:hover { background: var(--md-error-container); }
  textarea { resize: vertical; min-height: 110px; }

  /* 多级目录树编辑器 */
  .tnode { margin-bottom: 8px; }
  .trow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .tno { font-weight: 700; color: var(--md-primary); font-size: 13px; min-width: 40px; flex-shrink: 0; }
  .ttitle { flex: 1; padding: 8px 10px; }
  .t-tag {
    font-size: 11px; border: 1px solid var(--md-success); color: var(--md-on-success-container);
    background: var(--md-success-container); border-radius: var(--radius-pill);
    padding: 2px 10px; white-space: nowrap; flex-shrink: 0;
  }
  .t-tag.empty { border-color: var(--md-outline-variant); color: var(--md-on-surface-variant); background: transparent; }
  .tbtns { display: flex; gap: 4px; flex-shrink: 0; }
  .tbtns button {
    border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-lowest);
    color: var(--md-on-surface-variant); font-size: 12px; padding: 5px 9px;
    border-radius: var(--radius-pill); cursor: pointer; line-height: 1.2;
    transition: border-color var(--transition), color var(--transition), background var(--transition);
  }
  .tbtns button:hover { border-color: var(--md-primary); color: var(--md-primary); background: var(--md-primary-container); }
  .tbtns button.danger:hover { border-color: var(--md-error); color: var(--md-error); background: var(--md-error-container); }
  .tbody { margin-bottom: 4px; }
  .tbody textarea { min-height: 76px; font-size: 13.5px; }
  .tchildren { border-left: 1px dashed var(--md-outline-variant); margin-left: 20px; padding-left: 8px; }
  .t-note {
    font-size: 11px; border: 1px solid var(--md-secondary-container); color: var(--md-on-secondary-container);
    background: var(--md-secondary-container); border-radius: var(--radius-pill);
    padding: 2px 10px; white-space: nowrap; flex-shrink: 0;
  }
  .import-hint { font-size: 13px; color: var(--md-on-surface-variant); }
  .import-hint.ok { color: var(--md-success); }
  .import-hint.err { color: var(--md-error); }

  /* 多人姓名 chip 输入 */
  .chip-wrap {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px;
    border: 1px solid var(--md-outline); border-radius: var(--radius-s);
    background: transparent; min-height: 44px; align-items: center;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .chip-wrap:focus-within { border-color: var(--md-primary); box-shadow: 0 0 0 2px var(--md-primary-container); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--md-secondary-container); color: var(--md-on-secondary-container);
    border-radius: var(--radius-pill); padding: 5px 12px; font-size: 13px;
  }
  .chip button {
    border: none; background: transparent; color: var(--md-on-secondary-container);
    cursor: pointer; font-size: 13px; padding: 0; line-height: 1; opacity: .7;
  }
  .chip button:hover { opacity: 1; color: var(--md-error); }
  .chip-input {
    flex: 1; min-width: 140px; border: none; outline: none; padding: 4px 2px;
    font-size: 14px; background: transparent; width: auto; color: var(--md-on-surface);
  }

  /* 版权页等可折叠附加区 */
  details.extra {
    margin: 10px 0 14px; border: 1px dashed var(--md-outline-variant);
    border-radius: var(--radius-m); padding: 12px 16px; background: var(--md-surface-container-low);
  }
  details.extra summary {
    cursor: pointer; font-size: 13px; color: var(--md-primary);
    font-weight: 600; user-select: none;
  }

  /* 通用按钮：M3 filled / tonal / outlined */
  .btn {
    border: none; border-radius: var(--radius-pill); padding: 11px 26px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: background var(--transition), color var(--transition), box-shadow var(--transition);
  }
  .btn-primary { background: var(--md-primary); color: var(--md-on-primary); box-shadow: var(--shadow-1); }
  .btn-primary:hover { box-shadow: var(--shadow-2); background: var(--md-primary); filter: brightness(1.06); }
  .btn-primary:disabled { background: var(--md-surface-container-high); color: var(--md-on-surface-variant); box-shadow: none; cursor: wait; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--md-outline); color: var(--md-primary);
    padding: 9px 18px; font-size: 13.5px;
  }
  .btn-ghost:hover { background: var(--md-primary-container); border-color: var(--md-primary); }
  .btn-block { width: 100%; margin-top: 20px; }

  /* 格式勾选 */
  .formats { display: flex; gap: 18px; margin-top: 4px; flex-wrap: wrap; }
  .formats label {
    display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;
    font-weight: 500; color: var(--md-on-surface);
  }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--md-primary); }

  /* 上传区 */
  .drop {
    border: 2px dashed var(--md-outline); border-radius: var(--radius-l);
    padding: 34px 20px; text-align: center; cursor: pointer;
    transition: all var(--transition); background: var(--md-surface-container-low);
  }
  .drop:hover, .drop.over { border-color: var(--md-primary); background: var(--md-primary-container); }
  .drop .big { font-size: 34px; color: var(--md-primary); line-height: 1; margin-bottom: 8px; }
  .drop p { color: var(--md-on-surface-variant); font-size: 14px; }
  .drop p b { color: var(--md-on-surface); }

  /* 图片列表 */
  .img-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .img-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border: 1px solid var(--md-outline-variant); border-radius: var(--radius-m);
    background: var(--md-surface-container-low); cursor: grab;
  }
  .img-item.dragging { opacity: .5; }
  .img-item.over { border-color: var(--md-primary); box-shadow: 0 0 0 2px var(--md-primary-container); }
  .img-item img { width: 52px; height: 68px; object-fit: cover; border-radius: 8px; background: var(--md-surface-container-high); }
  .img-item .meta { flex: 1; font-size: 13px; color: var(--md-on-surface-variant); }
  .img-item .meta .no { color: var(--md-primary); font-weight: 700; margin-right: 6px; }
  .img-item .handle { color: var(--md-outline); font-size: 16px; }

  /* 封面预览 */
  .cover-preview { margin-top: 8px; display: none; }
  .cover-preview img { max-height: 150px; border-radius: 12px; border: 1px solid var(--md-outline-variant); }

  /* 状态与结果 */
  .status { display: none; margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-m); font-size: 14px; }
  .status.error { display: block; background: var(--md-error-container); color: var(--md-on-error-container); }
  .status.running { display: block; background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .status.ok { display: block; background: var(--md-success-container); color: var(--md-on-success-container); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px;
    border: 2px solid var(--md-primary); border-top-color: transparent; border-radius: 50%;
    animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { display: none; margin-top: 16px; }
  .results .head { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .result-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--md-outline-variant); border-radius: var(--radius-m);
    background: var(--md-surface-container-low); margin-bottom: 8px;
  }
  .result-item .fmt-badge {
    background: var(--md-primary); color: var(--md-on-primary); font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: var(--radius-pill); min-width: 48px; text-align: center;
  }
  .result-item .fname { flex: 1; font-size: 14px; font-weight: 600; word-break: break-all; }
  .result-item .fsize { color: var(--md-on-surface-variant); font-size: 13px; }
  .dl {
    background: var(--md-secondary-container); color: var(--md-on-secondary-container);
    text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 18px;
    border-radius: var(--radius-pill);
  }
  .dl:hover { filter: brightness(.96); }
  footer { text-align: center; color: var(--md-on-surface-variant); font-size: 12px; margin-top: 34px; }

  @media (max-width: 560px) {
    .row { flex-direction: column; gap: 0; }
    .wrap { padding: 24px 14px 60px; }
    .card { padding: 18px; }
  }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Book<span>Forge</span></div>
    <div class="tagline">自制 Kindle 支持格式（EPUB / AZW3）的书籍 · 文字成书 · 图片成漫</div>
  </header>
  <div class="theme-bar" role="group" aria-label="主题色">
    <span class="theme-label">主题</span>
    <div class="theme-swatches" id="theme-swatches"></div>
    <label class="theme-custom" title="自定义颜色"><input type="color" id="theme-custom" value="#6750a4"></label>
  </div>


  <div class="tabs">
    <div class="tab active" data-pane="text">文字成书</div>
    <div class="tab" data-pane="comic">图片成漫画</div>
  </div>

  <!-- ===================== 文字书 ===================== -->
  <div class="card">
    <div class="pane active" id="pane-text">
      <div class="row">
        <div class="field"><label>书名</label><input type="text" id="t-title" placeholder="例如：我的短篇集"></div>
        <div class="field"><label>语言</label>
          <select id="t-lang">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>排版 <small>随语言自动设置默认，可手动调整</small></label>
          <div class="formats">
            <label><input type="checkbox" id="t-indent" checked> 首行缩进 2 字符</label>
            <label><input type="checkbox" id="t-blank-para"> 空行分段（不勾选＝每个回车即新段）</label>
          </div>
          <div class="formats" style="margin-top:6px">
            <label>注释形式
              <select id="t-notes-mode">
                <option value="chapter">章末脚注（每章末尾注释区）</option>
                <option value="endbook">书末注释（全书统一编号，书末"注释"章节）</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>著者 <small>可多人，输入后回车添加</small></label>
          <div class="chip-wrap" id="t-authors"><input type="text" class="chip-input" placeholder="如：马克思"></div>
        </div>
        <div class="field"><label>译者 <small>可选 · 可多人</small></label>
          <div class="chip-wrap" id="t-translators"><input type="text" class="chip-input" placeholder="如：郭大力"></div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>封面（可选）<small> · JPG/PNG/GIF</small></label>
          <input type="file" id="t-cover" accept="image/jpeg,image/png,image/gif">
          <div class="cover-preview" id="t-cover-preview"><img alt="封面预览"></div>
        </div>
      </div>

      <details class="extra">
        <summary>版权页（可选）</summary>
        <div class="row">
          <div class="field"><label>出版社</label><input type="text" id="t-publisher" placeholder="如：人民出版社"></div>
          <div class="field"><label>出版时间 <small>可选 · 可只填年份或精确到日</small></label><input type="text" id="t-year" placeholder="如：2026 或 2026-10-03"></div>
        </div>
        <div class="row">
          <div class="field"><label>ISBN <small>可选</small></label><input type="text" id="t-isbn" placeholder="如：978-7-01-000000-0"></div>
          <div class="field"><label>　</label><span class="import-hint">生成时自动补全 © 声明与“本书由 BookForge 制作”</span></div>
        </div>
      </details>

      <div class="field">
        <label>从文件导入 <small> · TXT：一篇追加一个章节（多选连续导入，自动识别注释）；EPUB：解析整本（多级目录/注释/著译者元数据），导入后替换当前目录；DOCX：解析 Word 文档（标题样式还原多级目录、脚注转注释），导入后替换当前目录</small></label>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="t-import" type="button">选择 TXT 文件…</button>
          <button class="btn btn-ghost" id="t-import-epub" type="button">导入 EPUB…</button>
          <button class="btn btn-ghost" id="t-import-docx" type="button">导入 DOCX…</button>
          <input type="file" id="t-import-file" accept=".txt,text/plain" multiple style="display:none">
          <input type="file" id="t-import-epub-file" accept=".epub,application/epub+zip" style="display:none">
          <input type="file" id="t-import-docx-file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none">
          <span class="import-hint" id="t-import-status"></span>
        </div>
      </div>

      <div class="field">
        <label>目录与正文 <small> · 多级目录：卷/篇/章/节；有正文的条目生成页面，留空则仅作分类层级；空行自动分段</small></label>
        <div id="t-chapters"></div>
        <button class="btn btn-ghost" id="t-add-chapter" type="button">＋ 添加卷 / 章</button>
      </div>

      <div class="field">
        <label>输出格式</label>
        <div class="formats">
          <label><input type="checkbox" id="t-epub" checked> EPUB（通用，新版 Kindle 原生支持）</label>
          <label><input type="checkbox" id="t-azw3"> AZW3（老款 Kindle 兼容，经 Calibre 转换）</label>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="t-build" type="button">锻造这本书</button>
      <div class="status" id="t-status"></div>
      <div class="results" id="t-results"><div class="head">锻造完成，下载你的书：</div></div>
    </div>

    <!-- ===================== 漫画书（同一卡片，tab 互斥切换） ===================== -->
    <div class="pane" id="pane-comic" style="display:none">
      <div class="row">

"use strict";

/* ---------------- Material 3 主题色 ---------------- */
const SEEDS = {
  violet: "#6750a4", blue: "#2d6bcf", green: "#3a7d44", teal: "#00696d",
  orange: "#b0540f", red: "#b3261e", pink: "#c2185b", brown: "#7a5a3a",
};
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (mx + mn) / 2;
  const s = d ? (d / (1 - Math.abs(2 * l - 1))) : 0;
  return [h, s, l];
}
function hslToHex(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  const to = (v) => Math.round(Math.min(255, Math.max(0, (v + m) * 255))).toString(16).padStart(2, "0");
  return "#" + to(r) + to(g) + to(b);
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function makePalette(seed) {
  const [h, s, l] = hexToHsl(seed);
  return {
    "--md-primary": hslToHex(h, clamp(s * 1.05, 0.25, 0.55), clamp(l, 0.3, 0.45)),
    "--md-on-primary": l > 0.62 ? "#1d1b20" : "#ffffff",
    "--md-primary-container": hslToHex(h, clamp(s * 0.72, 0.28, 0.55), clamp(l + 0.36, 0.84, 0.95)),
    "--md-on-primary-container": hslToHex(h, clamp(s * 0.8, 0.22, 0.42), clamp(l - 0.34, 0.08, 0.18)),
    "--md-secondary-container": hslToHex(h, clamp(s * 0.45, 0.22, 0.42), 0.92),
    "--md-on-secondary-container": hslToHex(h, clamp(s * 0.7, 0.22, 0.4), clamp(l - 0.3, 0.1, 0.2)),
    "--md-surface": hslToHex(h, clamp(s * 0.07, 0.02, 0.07), 0.99),
    "--md-surface-dim": hslToHex(h, clamp(s * 0.1, 0.03, 0.09), 0.88),
    "--md-surface-container-lowest": "#ffffff",
    "--md-surface-container-low": hslToHex(h, clamp(s * 0.08, 0.02, 0.08), 0.97),
    "--md-surface-container": hslToHex(h, clamp(s * 0.09, 0.03, 0.09), 0.95),
    "--md-surface-container-high": hslToHex(h, clamp(s * 0.1, 0.03, 0.1), 0.93),
    "--md-surface-container-highest": hslToHex(h, clamp(s * 0.12, 0.04, 0.12), 0.9),
    "--md-on-surface": hslToHex(h, clamp(s * 0.18, 0.06, 0.18), 0.13),
    "--md-on-surface-variant": hslToHex(h, clamp(s * 0.12, 0.04, 0.13), 0.35),
    "--md-outline": hslToHex(h, clamp(s * 0.1, 0.03, 0.11), 0.48),
    "--md-outline-variant": hslToHex(h, clamp(s * 0.09, 0.03, 0.09), 0.82),
  };
}
function applyTheme(key) {
  const seed = key === "custom"
    ? (localStorage.getItem("bookforge-theme-custom") || "#6750a4")
    : SEEDS[key];
  const vars = makePalette(seed);
  const root = document.documentElement.style;
  Object.keys(vars).forEach(k => root.setProperty(k, vars[k]));
  document.querySelectorAll(".swatch").forEach((s, i) => {
    s.classList.toggle("on", s.dataset.key === key);
  });
  localStorage.setItem("bookforge-theme", key);
  if (key === "custom") localStorage.setItem("bookforge-theme-custom", seed);
}
function initTheme() {

  const picker = $("theme-custom");
  picker.addEventListener("input", () => {

}

function initChip(id, list) {

      chip.appendChild(x);

    });

  if (!wrap.dataset.bound) {
    const add = () => {
      const v = input.value.trim();
      if (v && !wrap._list.includes(v)) { wrap._list.push(v); input.value = ""; render(); }
    };
    input.addEventListener("keydown", e => {

function setChips(id, newList) {

let treeSeq = 1;
function newNode() { return { id: treeSeq++, title: "", content: "", children: [] }; }

function renderNode(node, path) {
  const depth = path.length;
  const div = document.createElement("div");
  div.className = "tnode";
  div.dataset.id = node.id;

    '<div class="trow" style="padding-left:' + ((depth - 1) * 24) + 'px">' +
      '<span class="tno">' + path.join(".") + '</span>' +
      '<input class="ttitle" placeholder="标题（如：第一卷 / 第一篇 / 第一章 / 第一节）" value="' + escapeHtml(node.title) + '">' +
      '<span class="t-tag' + (hasContent ? "" : " empty") + '">' + (hasContent ? "正文" : "目录层级") + '</span>' +
      ((node.notes && Object.keys(node.notes).length) ? '<span class="t-note">' + Object.keys(node.notes).length + ' 条注</span>' : "") +
      '<div class="tbtns">' +
        '<button data-act="child" title="添加子级（下一层）">+子</button>' +
        '<button data-act="after" title="添加同级（后面）">+后</button>' +
        '<button data-act="up" title="上移">↑</button>' +
        '<button data-act="down" title="下移">↓</button>' +
        '<button data-act="promote" title="提升层级（变为父级层级，紧跟其后）">升层</button>' +
        '<button data-act="demote" title="降低层级（归入前一个同级条目之下）">降层</button>' +
        '<button data-act="del" class="danger" title="删除（连同子级）">删</button>' +
      '</div>' +
    '</div>' +
    '<div class="tbody" style="padding-left:' + ((depth - 1) * 24) + 'px">' +
      '<textarea class="tcontent" placeholder="正文（纯文本，空行自动分段）。若留空，则本条仅作为目录分类层级。">' + escapeHtml(node.content) + '</textarea>' +
    '</div>' +
    '<div class="tchildren"></div>';
  div.querySelector(".ttitle").addEventListener("input", e => node.title = e.target.value);
  div.querySelector(".tcontent").addEventListener("input", e => node.content = e.target.value);
  const childBox = div.querySelector(".tchildren");
  node.children.forEach((c, i) => childBox.appendChild(renderNode(c, path.concat(i + 1))));
  return div;
}

function renderTree() {
  const box = $("t-chapters");

/* 树统计与编号（EPUB 导入回填用） */
function countTree(nodes) {
  let nodesN = 0, pagesN = 0;
  (function walk(ns) {
    ns.forEach(n => {
      nodesN++;
      if ((n.content || "").trim()) pagesN++;
      walk(n.children || []);
    });
  })(nodes || []);
  return { nodes: nodesN, pages: pagesN };
}

function renumber(nodes) {
  (function walk(ns) {
    ns.forEach(n => {
      n.id = treeSeq++;
      walk(n.children || []);
    });
  })(nodes || []);
}

function updateTreeStats() {
  let total = 0, pages = 0;
  (function walk(nodes) {
    nodes.forEach(n => {
      total++;
      if ((n.content || "").trim()) pages++;
      walk(n.children);
    });
  })(tree);
  const label = $("t-chapters").previousElementSibling; // label 元素
  if (label) {
    label.innerHTML = "目录与正文 <small> · 多级目录：卷/篇/章/节；有正文的条目生成页面，留空则仅作分类层级；空行自动分段 —— 当前共 " +
      total + " 条，其中 " + pages + " 个正文页</small>";
  }
}

function cleanNode(n) {
  return {
    title: n.title, content: n.content, notes: n.notes || {},
    title_marks: n.title_marks || [], _plain_notes: !!n._plain_notes,
    children: n.children.map(cleanNode)
  };
}

/* 树操作（事件委托） */
$("t-chapters").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const tnode = btn.closest(".tnode");
  const id = Number(tnode.dataset.id);
  const hit = findNodeIn(tree, id);
  if (!hit) return;
  const act = btn.dataset.act;
  const { node, parent, idx } = hit;
  if (act === "child") {
    node.children.push(newNode());
  } else if (act === "after") {
    parent.splice(idx + 1, 0, newNode());
  } else if (act === "up") {
    if (idx > 0) { parent.splice(idx, 1); parent.splice(idx - 1, 0, node); }
  } else if (act === "down") {
    if (idx < parent.length - 1) { parent.splice(idx, 1); parent.splice(idx + 1, 0, node); }
  } else if (act === "promote") {
    const r = treePromote(tree, id);
    if (!r.ok) { alert(r.msg); return; }
  } else if (act === "demote") {
    const r = treeDemote(tree, id);
    if (!r.ok) { alert(r.msg); return; }
  } else if (act === "del") {
    if (!confirm("删除「" + (node.title || "未命名") + "」及其全部子级？")) return;
    parent.splice(idx, 1);
    if (!tree.length) tree.push(newNode());
  }
  renderTree();
});

/* ---------------- TXT 导入（注释感知解析） ---------------- */
const CIRCLED = { "①":"1","②":"2","③":"3","④":"4","⑤":"5","⑥":"6","⑦":"7","⑧":"8","⑨":"9","⑩":"10","⑪":"11","⑫":"12","⑬":"13","⑭":"14","⑮":"15","⑯":"16","⑰":"17","⑱":"18","⑲":"19","⑳":"20" };

function readTxt(file) {
  /* 优先 UTF-8，出现替换符则按 GBK 重读（兼容国产 txt） */
  return new Promise(resolve => {
    const r1 = new FileReader();
    r1.onload = () => {
      const text = r1.result || "";
      if (text.includes("\uFFFD")) {
        const r2 = new FileReader();
        r2.onload = () => resolve(r2.result || text);
        r2.onerror = () => resolve(text);
        r2.readAsText(file, "gbk");
      } else {
        resolve(text);
      }
    };
    r1.onerror = () => resolve("");
    r1.readAsText(file, "utf-8");
  });
}

function normalizeNoteMarks(line, notes) {
  /* 〔N〕保持；[N] 与圈号转 〔N〕——仅当编号在注释表中（防误伤正文方括号） */
  let out = line.replace(/[〔\[](\d{1,4})[〕\]]/g, (m, n) => notes[n] ? "〔" + n + "〕" : m);
  out = out.replace(/[①-⑳]/g, ch => {
    const n = CIRCLED[ch];
    return notes[n] ? "〔" + n + "〕" : ch;
  });
  return out;
}

function parseTxt(text) {
  /* 返回 { body, notes, problems, noteCount } */
  const lines = text.split(/\r?\n/);
  const notes = {};
  const problems = [];
  const bodyLines = [];
  let inNotes = false;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    // 注释区标题行：注释 / 注 / 【注释】 / 注释：
    if (!inNotes && /^[【\[]?(注释|注|脚注)[】\]]?[：:]?$/.test(line)) {
      inNotes = true;
      continue;
    }
    const mEntry = /^[〔\[](\d{1,4})[〕\]](.*)$/.exec(line);
    const mCircle = /^([①-⑳])(.*)$/.exec(line);
    if (inNotes) {
      if (mEntry || mCircle) {
        let no = mEntry ? mEntry[1] : CIRCLED[mCircle[1]];
        const tail = (mEntry ? mEntry[2] : mCircle[2]).trim();
        if (notes[no]) problems.push("注释 " + no + " 重复定义，已覆盖");
        notes[no] = tail;
      } else if (/^（.+）$/.test(line)) {
        // 整行圆括号括注（题解/编者说明）：注释区结束，归为正文
        inNotes = false;
        bodyLines.push(line);
      } else if (Object.keys(notes).length) {
        const last = Object.keys(notes).pop();
        notes[last] += "\n" + line;   // 注释多行续接
      } else {
        bodyLines.push(line);
      }
      continue;
    }
    // 段后注：正文行以〔N〕开头（圈号开头的整行是正文序号，不当作注释）
    if (mEntry) {
      if (!notes[mEntry[1]]) notes[mEntry[1]] = mEntry[2].trim();
      continue;
    }
    bodyLines.push(line);
  }
  const body = bodyLines.map(l => normalizeNoteMarks(l, notes)).join("\n\n");
  return { body, notes, problems, noteCount: Object.keys(notes).length };
}

function normalizeMarksLoose(line) {
  /* 无注释表时的纯外观统一：〔N〕/[N]/圈号 -> 〔N〕（不配对，生成时保留原样） */
  let out = line.replace(/[〔\[](\d{1,4})[〕\]]/g, (m, n) => "〔" + n + "〕");
  out = out.replace(/[①-⑳]/g, ch => "〔" + CIRCLED[ch] + "〕");
  return out;
}

function tidyChapter(node) {
  /* 提交前自动整理单个章节：粘贴的文本若含注释区（“注释”标题 + 〔N〕条目），
     提取为 notes 并从正文剥离；无注释区则仅统一标记外观。返回识别注释条数。 */
  if (!node.content || !node.content.trim()) return 0;
  if (node.notes && Object.keys(node.notes).length) return 0;  // 已有注释表（导入），不重复解析
  const r = parseTxt(node.content);
  if (r.noteCount > 0) {
    node.notes = r.notes;
    node.content = r.body;
    return r.noteCount;
  }
  node.content = node.content.split(/\r?\n/).map(l => normalizeMarksLoose(l)).join("\n");
  return 0;
}

function tidyTree() {
  let total = 0;
  (function walk(nodes) {
    nodes.forEach(n => {
      total += tidyChapter(n);
      walk(n.children);
    });
  })(tree);
  return total;
}

$("t-import").addEventListener("click", () => $("t-import-file").click());
$("t-import-file").addEventListener("change", async e => {
  const files = [...e.target.files];
  const st = $("t-import-status");
  if (!files.length) return;
  let imported = 0, notesTotal = 0;
  const probs = [];
  for (const f of files) {
    const text = await readTxt(f);
    const r = parseTxt(text);
    const name = (f.name.replace(/\.txt$/i, "") || "未命名").trim();
    tree.push({ id: treeSeq++, title: name, content: r.body, children: [], notes: r.notes });
    imported++;
    notesTotal += r.noteCount;
    for (const p of r.problems) probs.push(f.name + "：" + p);
  }
  renderTree();
  e.target.value = "";
  st.className = "import-hint ok";
  st.textContent = "已导入 " + imported + " 篇，共识别 " + notesTotal + " 条注释" +
    (probs.length ? " · 注意：" + probs.join("；") : "");
});
$("t-import-epub").addEventListener("click", () => $("t-import-epub-file").click());

    st.textContent = "已导入《" + (m.title || "未命名") + "》：目录 " + cnt.nodes +
      " 项 / 正文 " + cnt.pages + " 页" +

      (m.warnings && m.warnings.length ? " · " + m.warnings.length + " 个章节解析告警（详见正文）" : "") +
      "（已替换当前目录）";
  } catch (err) {

    st.textContent = "EPUB 导入失败：" + err.message;
  } finally {
    e.target.value = "";
  }
});

/* ---------------- 漫画书 ---------------- */
let comicFiles = [];   // File 数组，顺序即页码

const drop = $("c-drop"), fileInput = $("c-file");
drop.addEventListener("click", () => fileInput.click());
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  if (e.dataTransfer && e.dataTransfer.files.length) addImages([...e.dataTransfer.files]);
});
fileInput.addEventListener("change", () => { addImages([...fileInput.files]); fileInput.value = ""; });

function addImages(files) {
  const okTypes = ["image/jpeg", "image/png", "image/gif"];
  for (const f of files) {
    if (!okTypes.includes(f.type)) { alert("不支持的格式：" + f.name + "（仅支持 JPG/PNG/GIF）"); continue; }
    comicFiles.push(f);
  }
  renderComicList();
}

function renderComicList() {
  const list = $("c-list");
  list.innerHTML = "";
  comicFiles.forEach((f, i) => {
    const item = document.createElement("div");
    item.className = "img-item";
    item.draggable = true;
    item.dataset.idx = i;
    item.innerHTML =
      '<img src="' + URL.createObjectURL(f) + '" alt="">' +
      '<div class="meta"><span class="no">第 ' + (i+1) + ' 页</span>' + escapeHtml(f.name) +
      '<br>' + fmtSize(f.size) + '</div>' +
      '<button class="btn-del" type="button">删除</button>';
    item.querySelector(".btn-del").addEventListener("click", () => {
      comicFiles.splice(i, 1);
      renderComicList();
    });
    list.appendChild(item);
  });
}

/* 拖拽排序 */
$("c-list").addEventListener("dragstart", e => {
  const item = e.target.closest(".img-item");
  if (!item) return;
  item.classList.add("dragging");
  e.dataTransfer.setData("text/plain", item.dataset.idx);
  e.dataTransfer.effectAllowed = "move";
});
$("c-list").addEventListener("dragover", e => {
  e.preventDefault();
  const over = e.target.closest(".img-item");
  if (over) { e.dataTransfer.dropEffect = "move"; over.classList.add("over"); }
});
$("c-list").addEventListener("dragleave", e => {
  const over = e.target.closest(".img-item");
  if (over) over.classList.remove("over");
});
$("c-list").addEventListener("drop", e => {
  e.preventDefault();
  const over = e.target.closest(".img-item");
  document.querySelectorAll(".img-item").forEach(n => n.classList.remove("over", "dragging"));
  if (!over) return;
  const from = parseInt(e.dataTransfer.getData("text/plain"), 10);
  const to = parseInt(over.dataset.idx, 10);
  if (isNaN(from) || isNaN(to) || from === to) return;
  const moved = comicFiles.splice(from, 1)[0];
  comicFiles.splice(to, 0, moved);
  renderComicList();
});

/* 生成漫画书 */
$("c-build").addEventListener("click", async () => {
  const st = statusEl("c-status");

    st.err("✗ 网络错误：" + err.message);
  } finally {

});
